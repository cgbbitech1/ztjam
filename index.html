<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin:0; padding:0; height:100%; background:#1c1a18; overflow:hidden; }
  * { box-sizing:border-box; }
  a { color:#c9a15a; text-decoration:none; }
  a:hover { color:#e8e3da; }
  canvas { display:block; }
</style>
</helmet>
<div style="position:relative; width:100vw; height:100vh; background:#1c1a18; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; color:#e8e3da; overflow:hidden; user-select:none">

  <div ref="{{ mountRef }}" style="position:absolute; inset:0"></div>

  <div style="position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:20px 24px; pointer-events:none; gap:24px">
    <div style="display:flex; flex-direction:column; gap:10px">
      <div style="display:flex; align-items:baseline; gap:12px">
        <div style="font-size:19px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase">Gridlock</div>
        <div style="font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:0.14em; color:#9a938a; text-transform:uppercase">Lot 6 &middot; drive the red car out</div>
      </div>
      <div style="display:flex; gap:8px; pointer-events:auto">
        <button onClick="{{ reset }}" style="appearance:none; background:transparent; border:1px solid rgba(232,227,218,0.14); border-radius:2px; color:#9a938a; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; padding:8px 14px; cursor:pointer">Reset</button>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:0.1em; color:#9a938a; text-transform:uppercase; text-align:right">
      <div>Moves <span style="color:#e8e3da">{{ moves }}</span></div>
      <div>{{ modeLabel }}</div>
    </div>
  </div>

  <div style="position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; padding:20px 24px; gap:24px; pointer-events:none">
    <div style="font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; line-height:1.9; letter-spacing:0.08em; color:#7e7873">
      <div><span style="color:#e8e3da">WASD</span> walk / drive &nbsp;&middot;&nbsp; <span style="color:#e8e3da">Mouse</span> look &nbsp;&middot;&nbsp; <span style="color:#e8e3da">E</span> enter / exit car</div>
      <div><span style="color:#e8e3da">Shift</span> sprint &nbsp;&middot;&nbsp; <span style="color:#e8e3da">Esc</span> release the cursor</div>
    </div>
    <div style="font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:0.1em; color:#c9a15a; text-align:right; min-height:16px">{{ hint }}</div>
  </div>

  <div style="position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; border-radius:50%; background:{{ dotColor }}; pointer-events:none"></div>

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#1c1a18">
      <div style="font-size:13px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:0.3em; text-transform:uppercase; color:#c9a15a">Loading</div>
      <div style="font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; letter-spacing:0.12em; color:#9a938a">{{ loadMsg }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ solved }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(28,26,24,0.72); backdrop-filter:blur(2px)">
      <div style="display:flex; flex-direction:column; align-items:center; gap:18px; padding:44px 56px; background:#232120; border:1px solid rgba(232,227,218,0.14)">
        <div style="font-size:13px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:0.3em; text-transform:uppercase; color:#c9a15a">Cleared</div>
        <div style="font-size:34px; font-weight:600; letter-spacing:-0.01em">The red car is out</div>
        <div style="font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; letter-spacing:0.12em; color:#9a938a; text-transform:uppercase">{{ moves }} moves</div>
        <button onClick="{{ reset }}" style="appearance:none; margin-top:6px; background:#e8e3da; border:none; border-radius:2px; color:#1c1a18; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; padding:12px 26px; cursor:pointer">Play again</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;citySeed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:1,&quot;max&quot;:99,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;City&quot;},&quot;cityDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.75,&quot;min&quot;:0.2,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;City&quot;}}">
const PACK_GLB = 'uploads/generic_passenger_car_pack (1).glb';
const CITY_GLB = 'uploads/low-poly_city_buildings.glb';
const CELL = 3.3, GRID = 6, EXIT_LANE = 2;
const COLORTEX = { Compact:'CompactBlue', Coupe:'CoupeBlue', Hatchback:'HatchbackYellow', Minivan:'MinivanRed', Offroad:'OffroadGreen', Pickup:'PickupGreen', SUV:'SUVBlack', Sedan:'SedanYellow', Sport:'SportRed', Wagon:'WagonBlue' };
const LEVEL = [
  { id:'RED SPORT',  model:'Sport',     o:'h', lane:2, pos0:0, len:2, target:true },
  { id:'GREY MINIVAN', model:'Minivan', o:'v', lane:3, pos0:0, len:3 },
  { id:'BLUE COUPE', model:'Coupe',     o:'h', lane:0, pos0:4, len:2 },
  { id:'GREEN OFFROAD', model:'Offroad',o:'v', lane:5, pos0:1, len:2 },
  { id:'BLUE WAGON', model:'Wagon',     o:'h', lane:4, pos0:1, len:2 },
  { id:'BLACK SUV',  model:'SUV',       o:'h', lane:5, pos0:2, len:3 },
  { id:'YELLOW HATCH', model:'Hatchback', o:'v', lane:0, pos0:4, len:2 }
];

class Component extends DCLogic {
  state = { moves:0, solved:false, hint:'', inCar:null, loading:true, loadMsg:'reading car pack' };
  mountRef = React.createRef();

  componentDidMount() { this.boot().catch(e => this.setState({ loadMsg:'failed: ' + e.message })); }
  componentDidUpdate(prev) {
    if (this.buildCity && (prev.citySeed !== this.props.citySeed || prev.cityDensity !== this.props.cityDensity)) this.buildCity();
  }
  componentWillUnmount() { this.dead = true; (this.cleanups || []).forEach(f => f()); }

  renderVals() {
    const s = this.state;
    return {
      mountRef: this.mountRef,
      moves: s.moves, solved: s.solved, hint: s.hint, loading: s.loading, loadMsg: s.loadMsg,
      modeLabel: s.inCar ? 'Driving · ' + s.inCar : 'On foot',
      dotColor: s.loading ? 'transparent' : 'rgba(232,227,218,0.55)',
      reset: () => this.resetLevel()
    };
  }

  resetLevel() {
    if (!this.cars) return;
    this.cars.forEach(c => { c.pos = c.pos0; c.moving = false; });
    this.player = { x: -0.5, z: 3, yaw: -Math.PI / 2, pitch: -0.05 };
    this.setDriving(null);
    this.setState({ moves:0, solved:false, hint:'' });
    this.syncCars();
  }

  async boot() {
    const THREE = await import('https://esm.sh/three@0.160.0');
    const { GLTFLoader } = await import('https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js');
    if (this.dead) return;
    const mount = this.mountRef.current;
    if (!mount) return;
    const w2 = g => (g - GRID / 2) * CELL;

    /* ---------------- scene ---------------- */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2c333c);
    scene.fog = new THREE.Fog(0x2c333c, 70, 240);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    scene.add(new THREE.HemisphereLight(0xcdd6de, 0x504739, 2.2));
    const sun = new THREE.DirectionalLight(0xfff3e2, 3.2);
    sun.position.set(18, 30, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left:-30, right:30, top:30, bottom:-30, near:1, far:100 });
    sun.shadow.bias = -0.0006;
    scene.add(sun);

    const cam = new THREE.PerspectiveCamera(74, mount.clientWidth / mount.clientHeight, 0.05, 400);
    cam.rotation.order = 'YXZ';

    const mat = (c, r, m) => new THREE.MeshStandardMaterial({ color:c, roughness:r === undefined ? 0.85 : r, metalness:m || 0 });

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), mat(0x272522, 0.95));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const PAD = 1;   // one-square walkway ring around the puzzle grid
    const lot = new THREE.Mesh(new THREE.BoxGeometry((GRID + PAD * 2) * CELL, 0.3, (GRID + PAD * 2) * CELL), mat(0x35322e, 0.9));
    lot.position.y = 0.15;
    lot.receiveShadow = true;
    scene.add(lot);

    const road = new THREE.Mesh(new THREE.BoxGeometry(24, 0.28, CELL), mat(0x312e2a, 0.9));
    road.position.set(w2(GRID + PAD) + 12, 0.14, w2(EXIT_LANE + 0.5));
    road.receiveShadow = true;
    scene.add(road);

    const paint = mat(0xe8e3da, 0.6), paintDim = mat(0x8f8a82, 0.7);
    for (let i = 1; i < GRID; i++) {
      const a = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.02, GRID * CELL - 0.5), paintDim);
      a.position.set(w2(i), 0.31, 0); scene.add(a);
      const b = new THREE.Mesh(new THREE.BoxGeometry(GRID * CELL - 0.5, 0.02, 0.14), paintDim);
      b.position.set(0, 0.31, w2(i)); scene.add(b);
    }
    const curbMat = mat(0x413c36, 0.9);
    const addCurb = (x, z, sx, sz) => {
      const c = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.45, sz), curbMat);
      c.position.set(x, 0.22, z); c.castShadow = true; c.receiveShadow = true; scene.add(c);
    };
    const S = (GRID + PAD * 2) * CELL;
    const E0 = w2(-PAD), E1 = w2(GRID + PAD);
    addCurb(0, E0 - 0.22, S + 0.9, 0.45);
    addCurb(0, E1 + 0.22, S + 0.9, 0.45);
    addCurb(E0 - 0.22, 0, 0.45, S + 0.9);
    addCurb(E1 + 0.22, (E0 + w2(EXIT_LANE)) / 2, 0.45, w2(EXIT_LANE) - E0 + 0.45);
    addCurb(E1 + 0.22, (E1 + w2(EXIT_LANE + 1)) / 2, 0.45, E1 - w2(EXIT_LANE + 1) + 0.45);
    for (let i = 0; i < 7; i++) {
      const d = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.02, 0.14), paint);
      d.position.set(E1 + 1.8 + i * 3.2, 0.3, w2(EXIT_LANE + 0.5)); scene.add(d);
    }


    /* ---------------- assets ---------------- */
    this.setState({ loadMsg: 'car pack (glb)' });
    const pack = await new GLTFLoader().loadAsync(PACK_GLB);
    if (this.dead) return;
    pack.scene.updateWorldMatrix(true, true);
    const meshes = [];
    pack.scene.traverse(o => { if (o.isMesh) meshes.push(o); });
    const wpos = o => o.getWorldPosition(new THREE.Vector3());
    const bodyGroups = {};   // key -> { parts:[], anchor:Mesh }
    const wheels = [];
    for (const m of meshes) {
      const bm = m.name.match(/^(.+?)_(?:body)_(body|glass|optics)_/i);
      if (bm) {
        const key = bm[1].charAt(0).toUpperCase() + bm[1].slice(1);
        const g = bodyGroups[key] || (bodyGroups[key] = { parts: [] });
        g.parts.push(m);
        if (/_body_\d*$/i.test(m.name) || /_body_0/i.test(m.name)) g.anchor = g.anchor || m;
      } else if (/^wheel_/i.test(m.name)) wheels.push(m);
    }

    const protos = {};
    for (const key of Object.keys(bodyGroups)) {
      const grp = bodyGroups[key];
      const anchor = grp.anchor || grp.parts[0];
      const bp = wpos(anchor);
      // wheels: cluster meshes by node root, keep the 4 nearest roots
      const roots = {};
      for (const w of wheels) {
        const p = wpos(w);
        const root = p.x.toFixed(2) + ',' + p.z.toFixed(2);
        (roots[root] || (roots[root] = [])).push(w);
      }
      const mine = Object.keys(roots)
        .map(r => ({ r, d: Math.min.apply(null, roots[r].map(w => wpos(w).distanceTo(bp))) }))
        .sort((a, b) => a.d - b.d)
        .slice(0, 4)
        .reduce((acc, x) => acc.concat(roots[x.r]), []);

      // yaw from the four wheel centres: the short pair is the axle (lateral) direction
      const centres = Object.keys(mine.reduce((a, w) => {
        const p = wpos(w);
        a[p.x.toFixed(2) + ',' + p.z.toFixed(2)] = 1;
        return a;
      }, {})).map(k => { const [x, z] = k.split(','); return { x: +x, z: +z }; });
      let yaw = 0;
      if (centres.length >= 3) {
        const p0 = centres[0];
        const mate = centres.slice(1).sort((a, b) =>
          Math.hypot(a.x - p0.x, a.z - p0.z) - Math.hypot(b.x - p0.x, b.z - p0.z))[0];
        const phi = Math.atan2(mate.z - p0.z, mate.x - p0.x);   // lateral axis
        yaw = Math.PI / 2 - phi;                                // inner.rotation.y = -yaw
      }

      const inner = new THREE.Group();
      for (const src of grp.parts.concat(mine)) {
        const m = new THREE.Mesh(src.geometry, src.material);
        src.updateWorldMatrix(true, false);
        m.applyMatrix4(src.matrixWorld);
        m.position.x -= bp.x; m.position.z -= bp.z;
        m.castShadow = true; m.receiveShadow = true;
        inner.add(m);
      }
      const wrap = new THREE.Group();
      wrap.add(inner);
      inner.rotation.y = -yaw;                       // axis-align
      inner.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(inner);
      if (box.getSize(new THREE.Vector3()).z > box.getSize(new THREE.Vector3()).x) {
        inner.rotation.y = -yaw - Math.PI / 2;        // length -> +X
        inner.updateMatrixWorld(true);
        box = new THREE.Box3().setFromObject(inner);
      }
      const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
      inner.position.set(-ctr.x, -box.min.y, -ctr.z);
      // footprint from the wheel rectangle — body hulls in this pack carry stray verts
      const wc = inner.children.slice(grp.parts.length).map(k => k.getWorldPosition(new THREE.Vector3()));
      let len = size.x, wid = size.z;
      if (wc.length >= 3) {
        const xs = wc.map(p => p.x), zs = wc.map(p => p.z);
        const wheelbase = Math.max.apply(null, xs) - Math.min.apply(null, xs);
        const track = Math.max.apply(null, zs) - Math.min.apply(null, zs);
        len = Math.min(size.x, wheelbase + 1.5);
        wid = Math.min(size.z, track + 0.35);
      }
      protos[key] = { group: wrap, len, wid, height: size.y };
    }
    for (const p of Object.values(protos)) {
      p.group.traverse(o => {
        if (!o.isMesh || !o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(mm => {
          if (/glass/i.test(mm.name)) { mm.transparent = true; mm.opacity = 0.45; mm.roughness = 0.08; mm.color = new THREE.Color(0x0d1114); mm.side = THREE.DoubleSide; }
          if (/optic/i.test(mm.name) && mm.map) { mm.emissiveMap = mm.map; mm.emissive = new THREE.Color(0xffffff); mm.emissiveIntensity = 0.3; }
        });
      });
    }

    /* ---------------- city skyline ---------------- */
    this.setState({ loadMsg: 'city blocks (glb)' });
    const city = await new GLTFLoader().loadAsync(CITY_GLB);
    if (this.dead) return;
    city.scene.updateWorldMatrix(true, true);
    const blockProtos = [];
    city.scene.traverse(o => {
      if (!o.isMesh) return;
      const mname = (Array.isArray(o.material) ? o.material[0] : o.material).name || '';
      if (/ground/i.test(mname) || /ground/i.test(o.name)) return;
      const b = new THREE.Box3().setFromObject(o);
      const s = b.getSize(new THREE.Vector3());
      if (s.y < 0.15) return;
      const c = b.getCenter(new THREE.Vector3());
      const m = new THREE.Mesh(o.geometry, o.material);
      o.updateWorldMatrix(true, false);
      m.applyMatrix4(o.matrixWorld);
      const holder = new THREE.Group();
      holder.add(m);
      m.position.sub(new THREE.Vector3(c.x, b.min.y, c.z));
      blockProtos.push({ holder, h: s.y, w: Math.max(s.x, s.z) });
    });

    const cityRoot = new THREE.Group();
    scene.add(cityRoot);
    const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

    this.buildCity = () => {
      while (cityRoot.children.length) cityRoot.remove(cityRoot.children[0]);
      if (!blockProtos.length) return;
      const seed = Math.floor(this.props.citySeed ?? 7);
      const density = Math.max(0.15, Math.min(1, this.props.cityDensity ?? 0.75));
      const r = rng(seed * 2654435761 + 11);
      const STEP = 15, RANGE = 145, INNER = S * 0.5 + 9;
      const padMat = mat(0x232120, 0.95);
      for (let gx = -RANGE; gx <= RANGE; gx += STEP) {
        for (let gz = -RANGE; gz <= RANGE; gz += STEP) {
          const jx = gx + (r() - 0.5) * 7, jz = gz + (r() - 0.5) * 7;
          const d = Math.hypot(jx, jz);
          if (d < INNER || d > RANGE) continue;
          if (Math.abs(jz - w2(EXIT_LANE + 0.5)) < 9 && jx > 0 && jx < 46) continue;   // keep the exit clear
          if (r() > density) continue;
          const pad = new THREE.Mesh(new THREE.BoxGeometry(STEP * 0.9, 0.2, STEP * 0.9), padMat);
          pad.position.set(jx, 0.06, jz);
          pad.receiveShadow = true;
          cityRoot.add(pad);
          const count = 1 + Math.floor(r() * 3);
          for (let k = 0; k < count; k++) {
            const p = blockProtos[Math.floor(r() * blockProtos.length)];
            const g = p.holder.clone(true);
            const near = 1 - Math.min(1, (d - INNER) / (RANGE - INNER));
            const targetH = (7 + r() * 16) + (1 - near) * (r() * 34);
            const sc = targetH / p.h;
            g.scale.setScalar(sc);
            const spread = STEP * 0.28;
            g.position.set(jx + (r() - 0.5) * spread * 2, 0.15, jz + (r() - 0.5) * spread * 2);
            g.rotation.y = Math.floor(r() * 4) * Math.PI / 2 + (r() - 0.5) * 0.12;
            g.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = true; } });
            cityRoot.add(g);
          }
        }
      }
    };

    this.setState({ loadMsg: 'car interior (glb)' });
    const glb = await new GLTFLoader().loadAsync('uploads/car_interior.glb');
    if (this.dead) return;
    const interiorSrc = glb.scene;
    interiorSrc.updateWorldMatrix(true, true);
    const ibox = new THREE.Box3().setFromObject(interiorSrc);
    const ictr = ibox.getCenter(new THREE.Vector3());
    const isize = ibox.getSize(new THREE.Vector3());
    const wheelBox = new THREE.Box3();
    interiorSrc.traverse(o => { if (o.isMesh && /weel/i.test(o.name)) wheelBox.expandByObject(o); });
    const swCtr = wheelBox.isEmpty() ? new THREE.Vector3(-1.3, 1.28, 0.94) : wheelBox.getCenter(new THREE.Vector3());
    interiorSrc.traverse(o => {
      if (!o.isMesh) return;
      o.material = new THREE.MeshStandardMaterial({ color:0x312e2b, roughness:0.75, metalness:0.05 });
      o.castShadow = false; o.receiveShadow = true;
    });

    const interiorHolder = new THREE.Group();      // rotates with the driven car
    const interior = new THREE.Group();            // centred + scaled cabin
    const centred = new THREE.Group();
    centred.add(interiorSrc);
    interiorSrc.position.sub(new THREE.Vector3(ictr.x, ibox.min.y, ictr.z));
    interior.add(centred);
    interiorHolder.add(interior);
    interiorHolder.visible = false;
    scene.add(interiorHolder);
    const floorPlate = new THREE.Mesh(new THREE.BoxGeometry(isize.x * 1.1, 0.06, isize.z * 1.1), new THREE.MeshStandardMaterial({ color:0x1a1817, roughness:0.9 }));
    floorPlate.position.y = 0.02;
    centred.add(floorPlate);
    const INT = { width: isize.z, length: isize.x, seatFromCtr: (swCtr.x - ictr.x), seatSide: (swCtr.z - ictr.z), swY: swCtr.y - ibox.min.y };

    /* ---------------- cars ---------------- */
    this.cars = LEVEL.map(c => {
      const p = protos[c.model] || protos.Sedan;
      const g = p.group.clone(true);
      scene.add(g);
      const car = Object.assign({}, c, { pos: c.pos0, mesh: g, len3: p.len, wid3: p.wid, h3: p.height });
      g.traverse(o => { if (o.isMesh) o.userData.car = car; });
      return car;
    });
    // idle scenery outside the lot
    ['Pickup', 'Sedan', 'Compact'].forEach((k, i) => {
      const p = protos[k];
      if (!p) return;
      const g = p.group.clone(true);
      g.position.set(-S * 0.5 - 6 - i * 0.6, 0, S * 0.5 + 4 + i * 6.4);
      g.rotation.y = Math.PI / 2 + (i - 1) * 0.06;
      scene.add(g);
    });

    const rect = (c, pos) => {
      const p = pos === undefined ? c.pos : pos;
      return c.o === 'h'
        ? { x0:p, x1:p + c.len, y0:c.lane, y1:c.lane + 1 }
        : { x0:c.lane, x1:c.lane + 1, y0:p, y1:p + c.len };
    };
    const overlap = (a, b) => a.x0 < b.x1 - 0.002 && b.x0 < a.x1 - 0.002 && a.y0 < b.y1 - 0.002 && b.y0 < a.y1 - 0.002;
    const legal = (car, pos) => {
      const maxOut = car.target ? GRID + 6 : GRID;
      if (pos < 0 || pos + car.len > maxOut) return false;
      const r = rect(car, pos);
      for (const o of this.cars) if (o !== car && overlap(r, rect(o))) return false;
      return true;
    };
    const centreOf = c => ({
      gx: c.o === 'h' ? c.pos + c.len / 2 : c.lane + 0.5,
      gy: c.o === 'h' ? c.lane + 0.5 : c.pos + c.len / 2
    });

    this.syncCars = () => {
      for (const c of this.cars) {
        const k = centreOf(c);
        c.mesh.position.set(w2(k.gx), 0.3, w2(k.gy));
        c.mesh.rotation.y = c.o === 'v' ? Math.PI / 2 : 0;
      }
    };

    const nudge = (car, delta) => {
      if (this.state.solved || !delta) return 0;
      let moved = 0, left = Math.abs(delta), sgn = Math.sign(delta);
      while (left > 0.0001) {
        const d = Math.min(0.03, left) * sgn;
        if (!legal(car, car.pos + d)) break;
        car.pos += d; moved += d; left -= Math.abs(d);
      }
      if (Math.abs(moved) > 0.0001) {
        if (!car.moving) { car.moving = true; this.setState(s => ({ moves: s.moves + 1 })); }
        car.still = 0;
        if (car.target && car.pos + car.len > GRID + 1.6 && !this.state.solved) {
          this.setState({ solved: true });
          if (document.pointerLockElement) document.exitPointerLock();
        }
      }
      return moved;
    };

    /* ---------------- player ---------------- */
    const pg = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.8, 6, 12), mat(0xd9d3c8, 0.7));
    torso.position.y = 1.05; torso.castShadow = true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 18, 14), mat(0xc9a15a, 0.6));
    head.position.y = 1.66; head.castShadow = true;
    pg.add(torso, head);
    scene.add(pg);
    this.player = { x: -0.5, z: 3, yaw: -Math.PI / 2, pitch: -0.05 };   // grid units, on the lot ring
    this.driving = null;

    // footprint of a car in world metres (axis-aligned)
    const footprint = (c) => {
      const k = centreOf(c);
      const cx = w2(k.gx), cz = w2(k.gy);
      const hx = (c.o === 'h' ? c.len3 : c.wid3) / 2;
      const hz = (c.o === 'h' ? c.wid3 : c.len3) / 2;
      return { x0:cx - hx, x1:cx + hx, z0:cz - hz, z1:cz + hz };
    };
    const PR = 0.3;   // player radius, metres
    const blockedAt = (wx, wz) => {
      for (const c of this.cars) {
        if (c === this.driving) continue;
        const f = footprint(c);
        const nx = Math.max(f.x0, Math.min(wx, f.x1));
        const nz = Math.max(f.z0, Math.min(wz, f.z1));
        if ((wx - nx) * (wx - nx) + (wz - nz) * (wz - nz) < PR * PR) return true;
      }
      return false;
    };
    const nearCar = () => {
      const wx = w2(this.player.x), wz = w2(this.player.z);
      let best = null, bd = 1e9;
      for (const c of this.cars) {
        const f = footprint(c);
        const nx = Math.max(f.x0, Math.min(wx, f.x1));
        const nz = Math.max(f.z0, Math.min(wz, f.z1));
        const d = Math.hypot(wx - nx, wz - nz);
        if (d < bd) { bd = d; best = c; }
      }
      return bd < 1.15 ? best : null;
    };
    this.nearCar = nearCar;

    const seatCam = (c) => {
      const k = centreOf(c);
      const cx = w2(k.gx), cz = w2(k.gy);
      const s = (c.wid3 * 0.96) / INT.width;
      const fwdX = c.o === 'h' ? -1 : 0, fwdZ = c.o === 'h' ? 0 : 1;   // interior front = local -X
      const backX = -fwdX, backZ = -fwdZ;
      const sideX = c.o === 'h' ? 0 : 1, sideZ = c.o === 'h' ? 1 : 0;
      const alongBack = (INT.seatFromCtr * -1 * s) + 0.42;   // behind the wheel
      const across = INT.seatSide * s;
      return {
        x: cx + backX * alongBack + sideX * across,
        y: 0.35 + INT.swY * s + 0.2,
        z: cz + backZ * alongBack + sideZ * across
      };
    };

    this.setDriving = (c) => {
      this.driving = c;
      pg.visible = !c;
      interiorHolder.visible = !!c;
      if (c) {
        const s = (c.wid3 * 0.96) / INT.width;
        interior.scale.setScalar(s);
        interiorHolder.rotation.y = c.o === 'v' ? Math.PI / 2 : 0;
        const theta = interiorHolder.rotation.y;
        this.player.yaw = Math.atan2(Math.cos(theta), -Math.sin(theta));
        this.player.pitch = -0.04;
      }
      this.setState({ inCar: c ? c.id : null, hint:'' });
    };

    this.toggleCar = () => {
      if (this.state.solved) return;
      if (this.driving) {
        const c = this.driving;
        const k = centreOf(c);
        const off = (c.o === 'h' ? c.wid3 : c.len3) / 2 + 0.7;
        const gx = k.gx + (c.o === 'h' ? 0 : off / CELL);
        const gz = k.gy + (c.o === 'h' ? off / CELL : 0);
        this.player.x = gx; this.player.z = gz;
        this.setDriving(null);
        return;
      }
      const n = nearCar();
      if (n) this.setDriving(n);
    };

    /* ---------------- input ---------------- */
    const keys = {};
    const onKeyDown = e => {
      keys[e.code] = true;
      if (e.code === 'KeyE') this.toggleCar();
      if (e.code === 'Escape' && document.pointerLockElement) document.exitPointerLock();
    };
    const onKeyUp = e => { keys[e.code] = false; };
    const onMouseMove = e => {
      if (document.pointerLockElement !== renderer.domElement) return;
      this.player.yaw -= e.movementX * 0.0022;
      this.player.pitch = Math.max(-1.2, Math.min(0.9, this.player.pitch - e.movementY * 0.0022));
    };

    const onDown = () => {
      if (!document.pointerLockElement && !this.state.solved) renderer.domElement.requestPointerLock();
    };
    const onResize = () => {
      const w = mount.clientWidth, h = mount.clientHeight;
      renderer.setSize(w, h);
      cam.aspect = w / h; cam.updateProjectionMatrix();
    };

    addEventListener('keydown', onKeyDown);
    addEventListener('keyup', onKeyUp);
    addEventListener('mousemove', onMouseMove);
    addEventListener('resize', onResize);
    renderer.domElement.addEventListener('mousedown', onDown);
    this.cleanups = [
      () => removeEventListener('keydown', onKeyDown),
      () => removeEventListener('keyup', onKeyUp),
      () => removeEventListener('mousemove', onMouseMove),
      () => removeEventListener('resize', onResize),
      () => renderer.dispose()
    ];

    /* ---------------- loop ---------------- */
    const clock = new THREE.Clock();
    const fwd = new THREE.Vector3();
    let hintCache = '';

    const walk = dt => {
      const speed = (keys.ShiftLeft ? 7.5 : 4.2) * dt;
      let f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      let s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      if (!f && !s) return;
      const L = Math.hypot(f, s); f /= L; s /= L;
      const sy = Math.sin(this.player.yaw), cy = Math.cos(this.player.yaw);
      const dx = (-sy * f + cy * s) * speed;
      const dz = (-cy * f - sy * s) * speed;
      let wx = w2(this.player.x), wz = w2(this.player.z);
      if (!blockedAt(wx + dx, wz)) wx += dx;
      if (!blockedAt(wx, wz + dz)) wz += dz;
      this.player.x = Math.min(GRID + 12, Math.max(-8, wx / CELL + GRID / 2));
      this.player.z = Math.min(GRID + 8, Math.max(-8, wz / CELL + GRID / 2));
    };

    const drive = dt => {
      const c = this.driving;
      cam.getWorldDirection(fwd);
      const sign = (c.o === 'h' ? fwd.x : fwd.z) >= 0 ? 1 : -1;
      const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      if (f) nudge(c, f * sign * (keys.ShiftLeft ? 5 : 3.2) * dt / CELL);
    };

    const tick = () => {
      if (this.dead) return;
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 0.05);

      for (const c of this.cars) {
        c.still = (c.still || 0) + dt;
        if (c.still > 0.25) c.moving = false;
      }
      if (!this.state.solved) {
        if (this.driving) drive(dt); else walk(dt);
      }
      this.syncCars();

      for (const c of this.cars) c.mesh.visible = this.driving !== c;
      pg.position.set(w2(this.player.x), 0.3, w2(this.player.z));
      pg.rotation.y = this.player.yaw;

      if (this.driving) {
        const c = this.driving, k = centreOf(c);
        interiorHolder.position.set(w2(k.gx), 0.34, w2(k.gy));
        const s = seatCam(c);
        cam.position.set(s.x, s.y, s.z);
      } else {
        cam.position.set(w2(this.player.x), 1.62, w2(this.player.z));
      }
      cam.rotation.y = this.player.yaw;
      cam.rotation.x = this.player.pitch;

      let hint = '';
      if (!this.state.solved) {
        if (this.driving) hint = 'E — step out of ' + this.driving.id;
        else { const n = nearCar(); if (n) hint = 'E — get into ' + n.id; }
      }
      if (hint !== hintCache) { hintCache = hint; this.setState({ hint }); }

      renderer.render(scene, cam);
    };

    this.buildCity();
    this.syncCars();
    onResize();
    window.__game = this;
    this.setState({ loading: false });
    tick();
  }
}
</script>
</body>
</html>
